name: release

# Triggered on a pushed `vX.Y.Z` tag. Validates the package, then
# (when the `CARGO_REGISTRY_TOKEN` repo secret is set AND the iac-forge
# git dependency has been migrated to a crates.io version) publishes
# to crates.io.
#
# BLOCKER: ansible-forge depends on `iac-forge` via git, not crates.io
# (see Cargo.toml line 19). `cargo publish` rejects git-source deps -- a
# crates.io publish requires path or version coordinates. The publish
# step below is therefore inert until iac-forge ships a 0.x.y release on
# crates.io and ansible-forge's Cargo.toml is bumped to depend on it
# with a `version = "..."` constraint.
#
# Until that lands, this workflow still:
#   - Builds and tests the crate
#   - Runs `cargo package --no-verify` to confirm the manifest is sane
#   - Creates a GitHub Release with the source tarball attached

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (informational; tag governs)'
        required: false
        type: string

permissions:
  contents: write   # required to cut the GitHub Release

jobs:
  publish_crate:
    name: package + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test --lib
        run: cargo test --lib --verbose

      - name: cargo package (no-verify; iac-forge git dep is not crates.io-publishable)
        run: cargo package --no-verify --allow-dirty

      - name: Publish to crates.io
        # IMPORTANT: this step is intentionally inert until iac-forge ships
        # on crates.io. When it does, drop the `false &&` guard, bump the
        # Cargo.toml `iac-forge` dep to `version = "X"`, and re-tag.
        # Both guards this step hand-rolled now live in the action, and it knows
        # more than they did: cargo-publish-crate detects a manifest that cannot
        # publish (the iac-forge git dep — see the BLOCKER note in the header),
        # skips a (name, version) already on crates.io, and retries on a 429.
        # It reports the skip through `skipped-no-publish` rather than an
        # `exit 0` that reads identically to success.
        #
        # The token guard becomes a step `if:` — a condition the engine
        # evaluates and the run graph shows, instead of a shell branch that
        # exited 0 whichever way it went.
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        uses: pleme-io/actions/cargo-publish-crate@main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/package/ansible-forge-*.crate
