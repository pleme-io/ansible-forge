[package]
name = "ansible-forge"
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
description = "Ansible module generator from IaC forge IR"
homepage = "https://github.com/pleme-io/ansible-forge"
repository = "https://github.com/pleme-io/ansible-forge"
documentation = "https://docs.rs/ansible-forge"
readme = "README.md"
license = "MIT"
categories = ["development-tools", "code-generators"]
keywords = ["ansible", "codegen", "iac", "module"]

[lints.clippy]
pedantic = "warn"

[dependencies]
iac-forge = { git = "https://github.com/pleme-io/iac-forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used to read the per-backend `platform_config` table (e.g. the Galaxy
# namespace override) shipped through `IacProvider.platform_config`.
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"
# Direct access to the OpenAPI parser for the end-to-end TOML walk test.
# iac-forge takes a &openapi_forge::Spec but doesn't re-export it.
openapi-forge = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
